# src/plugins/vtube_studio/config.toml

[vtube_studio]
# 是否启用此插件
enabled = true

# pyvts 连接和认证所需信息
plugin_name = "Amaidesu_VTS_Connector"
developer = "mai-devs"
# 存储 VTS API 认证 token 的文件路径 (相对于 Amaidesu 主程序运行目录)
authentication_token_path = "./src/plugins/vtube_studio/vts_token.txt"
# (可选) VTube Studio API 的地址和端口，如果不是默认值
vts_host = "localhost"
vts_port = 8001
# (可选) VTube Studio API 的名称和版本，如果不是默认值
vts_api_name = "VTubeStudioPublicAPI"
vts_api_version = "1.0"

# 口型同步功能配置
[vtube_studio.lip_sync]
enabled = true                    # 是否启用口型同步功能
volume_threshold = 0.01           # 音量阈值，低于此值认为是静音（0.001-0.1推荐）
smoothing_factor = 0.3            # 平滑因子，0-1之间，越大越平滑
vowel_detection_sensitivity = 2.0 # 元音检测敏感度（1.0-5.0推荐）
sample_rate = 32000               # 音频采样率（推荐32000以匹配TTS插件）
buffer_size = 1024                # 音频缓冲区大小

# 音频累积和时间同步配置
min_accumulation_duration = 0.1 # 最小累积时长（秒），控制口型更新频率
max_accumulation_duration = 0.2 # 最大累积时长（秒），防止延迟过大
playback_sync_enabled = true    # 是否启用播放时间同步，true=基于实际播放时间，false=基于音频数据长度

# 支持的VTS口型参数说明：
# - VoiceVolume: 音量参数 (0.0-1.0)
# - VoiceSilence: 静音参数 (0.0=有声, 1.0=静音)
# - VoiceA: A音参数 (0.0-1.0)
# - VoiceI: I音参数 (0.0-1.0)
# - VoiceU: U音参数 (0.0-1.0)
# - VoiceE: E音参数 (0.0-1.0)
# - VoiceO: O音参数 (0.0-1.0)


# 消息类型处理配置（从Warudo迁移）
[vtube_studio.message_types]
emotion_enabled = true     # 是否处理情绪(emotion)类型的消息
body_action_enabled = true # 是否处理身体动作(body_action)类型的消息
head_action_enabled = true # 是否处理头部动作(head_action)类型的消息
vtb_text_enabled = true    # 是否处理旧版的vtb_text类型的消息（已废弃但保留兼容性）


# 情绪数值到热键映射配置
# 根据情绪四维度值（joy, anger, sorrow, fear）自动选择合适的热键
[vtube_studio.emotion_value_mapping]
# 基于情绪主导维度的热键映射
# 当某个情绪维度值达到阈值且为主导情绪时触发
# 格式: 情绪类型_阈值 = "热键名称"
joy_high = "HappyShakehead"   # 高喜悦触发
joy_medium = "HappyNod"       # 中等喜悦触发
anger_high = "Angry"          # 高愤怒触发
anger_medium = "Surprised"    # 中等愤怒触发
sorrow_high = "SadCry"        # 高悲伤触发
sorrow_medium = "Helpless"    # 中等悲伤触发
fear_high = "ShyShakeHead"    # 高恐惧触发
fear_medium = "ConfusedThink" # 中等恐惧触发

# 情绪混合状态的热键映射
# 当多个情绪维度同时较高时触发
# 格式: 情绪类型1_情绪类型2 = "热键名称"
joy_fear = "ShyHappyShake"   # 喜悦+恐惧混合
joy_anger = "SurprisedWink"  # 喜悦+愤怒混合
sorrow_fear = "ShyShakeHead" # 悲伤+恐惧混合

# 情绪阈值配置
[vtube_studio.emotion_thresholds]
high = 7     # 高情绪阈值 (7-10)
medium = 4   # 中等情绪阈值 (4-6)
low = 1      # 低情绪阈值 (1-3)
dominant = 2 # 主导情绪差值 (某情绪比其他情绪至少高出这个值才算主导)
